<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twizen</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // On-screen error reporting: the TV has no console, so show problems in the UI.
    window.twzT0 = Date.now();
    (function () {
      var lines = [];
      function show(msg) {
        lines.push(msg);
        var box = document.getElementById('errors');
        if (!box) return;
        box.style.display = 'block';
        box.textContent = 'Twizen-Problem (bitte melden):\n' + lines.join('\n');
      }
      window.twzError = show;
      window.twzScriptFailed = function (el) { show('Konnte ' + el.getAttribute('src') + ' nicht laden'); };
      window.onerror = function (msg, src, line, col) {
        show(msg + ' (' + String(src || '').split('/').pop() + ':' + line + ':' + (col || 0) + ')');
      };
      setTimeout(function () {
        if (!window.TT || !window.TT.started) show('App ist nach 60 s nicht gestartet. UA: ' + navigator.userAgent);
      }, 60000);
    })();
  </script>
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="logo"><i></i>Twizen</div>
    </nav>
    <main id="main"><div id="boot" class="message boot">Twizen wird geladen …</div></main>
  </div>

  <div id="player" style="display:none">
    <div id="video-wrap">
      <video id="video"></video>
      <div id="player-status"></div>
      <div id="badges"></div>
      <div id="osd" class="osd">
        <div class="osd-top">
          <img id="osd-avatar" class="av" alt="">
          <div class="osd-text">
            <div class="osd-name-row"><span id="osd-name"></span><span class="pill live live-only">Live</span></div>
            <div id="osd-title"></div>
            <div id="osd-meta"></div>
          </div>
          <div class="osd-stats live-only">
            <div id="osd-viewers"></div>
            <div id="osd-uptime"></div>
          </div>
        </div>
        <div class="osd-bottom">
          <div id="osd-progress" class="osd-progress vod-only">
            <div class="osd-track"><div id="osd-bar"></div></div>
            <span id="osd-time"></span>
          </div>
          <div class="osd-row">
            <div id="osd-controls" class="osd-controls"></div>
            <div id="osd-keys" class="osd-keys"></div>
          </div>
        </div>
      </div>
    </div>
    <aside id="chat"><div class="chat-h">Stream-Chat</div><div id="chat-list"></div></aside>
  </div>

  <div id="toast" class="toast"></div>
  <pre id="errors"></pre>

  <!-- Built by tools/build.js from app/js. hls.js is loaded later, in the background. -->
  <script src="twizen.js" onerror="twzScriptFailed(this)"></script>
</body>
</html>
