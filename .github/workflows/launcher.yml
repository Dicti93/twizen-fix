# Builds the small "Twizen" TV app in launcher/ (own icon on the TV's app bar; it starts
# TizenBrew with the Twizen module) and publishes it as a GitHub release, so TizenBrew
# Installer can install it via "Dicti93/twizen-fix". Signed like TizenBrew's build for
# older TVs: a fresh Tizen author certificate + the public Tizen SDK distributor certificate.
name: Build Twizen launcher app

on:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write

env:
  TIZEN_STUDIO_VER: '5.6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tizen Studio CLI
        run: |
          curl -fLo tizen-installer "https://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VER}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VER}_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "${GITHUB_WORKSPACE}/tizen-studio"
          rm tizen-installer

      - name: Create signing profile
        env:
          PW: ${{ github.run_id }}Twz
        run: |
          T="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin/tizen"
          CG="${GITHUB_WORKSPACE}/tizen-studio/tools/certificate-generator/certificates"
          "$T" certificate -a twizen -p "$PW" -c DE -n Twizen -f twizen-author
          AUTHOR=$(find "$HOME" "${GITHUB_WORKSPACE}" -name 'twizen-author.p12' 2>/dev/null | head -1)
          echo "author certificate: $AUTHOR"
          "$T" security-profiles add -n TwizenOld -a "$AUTHOR" -p "$PW" \
            -d "$CG/distributor/sdk-public/tizen-distributor-signer.p12" -dp tizenpkcs12passfordsigner
          "$T" security-profiles list

      - name: Build and package
        run: |
          T="${GITHUB_WORKSPACE}/tizen-studio/tools/ide/bin/tizen"
          cd launcher
          "$T" build-web -- .
          "$T" package -t wgt -s TwizenOld -o "${GITHUB_WORKSPACE}/release" -- .buildResult
          ls -la "${GITHUB_WORKSPACE}/release"

      - name: Show Tizen CLI log on failure
        if: failure()
        run: find "$HOME" "${GITHUB_WORKSPACE}" -name cli.log -exec tail -n 80 {} \; 2>/dev/null || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Twizen-App (${{ github.ref_name }})
          body: |
            Kleine TV-App „Twizen“ mit eigenem Symbol. Sie startet TizenBrew direkt mit dem Modul
            `Dicti93/twizen-fix@0`. Installation mit dem TizenBrew Installer: `Dicti93/twizen-fix`.
          files: release/*.wgt
