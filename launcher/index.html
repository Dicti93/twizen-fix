<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Twizen</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0e10; color: #efeff1; font-family: "Samsung One", Roboto, Arial, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-size: 32px; }
    img { width: 200px; margin-bottom: 30px; border-radius: 24px; }
    #msg { color: #adadb8; max-width: 70%; text-align: center; line-height: 1.4; }
  </style>
</head>
<body>
  <img src="icon.png" alt="">
  <div id="msg">Twizen wird gestartet …</div>
  <script>
    // Launcher: TizenBrew lets other apps start one of its modules via AppControl data
    // { moduleName, moduleType } (see TizenBrew's WebSocketClient.onOpen). This app only
    // hands over and closes itself.
    var TIZENBREW_APP_ID = 'xvvl3S1bvH.TizenBrewStandalone';
    var MODULE = { moduleName: 'Dicti93/twizen-fix@0', moduleType: 'gh' };

    function show(text) { document.getElementById('msg').textContent = text; }

    function exitSoon() {
      setTimeout(function () {
        try { tizen.application.getCurrentApplication().exit(); } catch (e) { /* not on a TV */ }
      }, 500);
    }

    try {
      var control = new tizen.ApplicationControl('http://tizen.org/appcontrol/operation/default', null, null, null,
        [new tizen.ApplicationControlData('module', [JSON.stringify(MODULE)])]);
      tizen.application.launchAppControl(control, TIZENBREW_APP_ID, exitSoon, function (err) {
        show('TizenBrew konnte nicht gestartet werden (' + (err && err.message ? err.message : err) +
          '). Ist TizenBrew installiert und Twizen als Modul „Dicti93/twizen-fix@0“ eingetragen?');
      });
    } catch (e) {
      show('Fehler beim Starten: ' + e.message);
    }

    // Back closes the launcher if it stays open with an error.
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 10009 || e.keyCode === 27) {
        try { tizen.application.getCurrentApplication().exit(); } catch (err) { /* not on a TV */ }
      }
    });
  </script>
</body>
</html>
